# ViT tuning (#8): freeze patch embed + first 6 of 12 blocks (only change vs vit_small.yaml)
seed: 42
data:
  fer2013_root: data/fer2013
  rafdb_root: data/rafdb
  val_frac: 0.1
  img_size: 224
  channels: 3
  num_workers: 4
model:
  name: vit_small_patch16_224
  num_classes: 7
  pretrained: true
  freeze_blocks: 6
train:
  epochs: 15
  batch_size: 64
  lr: 0.00005
  weight_decay: 0.05
  warmup_epochs: 1
  label_smoothing: 0.1
  class_weights: true
  amp: true
  early_stop_patience: 5

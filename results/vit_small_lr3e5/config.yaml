data:
  channels: 3
  fer2013_root: /kaggle/input/datasets/msambare/fer2013
  img_size: 224
  num_workers: 2
  rafdb_root: /kaggle/input/datasets/neer768/rafdb-basic
  val_frac: 0.1
model:
  name: vit_small_patch16_224
  num_classes: 7
  pretrained: true
seed: 42
train:
  amp: true
  batch_size: 64
  class_weights: true
  early_stop_patience: 5
  epochs: 15
  label_smoothing: 0.1
  lr: 3.0e-05
  warmup_epochs: 1
  weight_decay: 0.05

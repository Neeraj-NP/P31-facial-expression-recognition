# Transfer learning: ImageNet-pretrained ResNet-18 (owner: Rakshita)
# Switch name to resnet50 for the bigger model (reduce batch_size to 32 on a 4 GB GPU).
# Every other setting is explained key by key in configs/cnn.yaml; only the differences are explained here.
seed: 42
data:
  fer2013_root: data/fer2013
  rafdb_root: data/rafdb
  val_frac: 0.1
  # img_size: 112 pixels (bigger than the CNN's 48 because ImageNet-pretrained ResNets expect larger images; 224 was also tried).
  img_size: 112
  # channels: 3 = the greyscale image is copied into 3 channels, which is what the pretrained ResNet expects.
  channels: 3
  num_workers: 4
model:
  name: resnet18
  num_classes: 7
  # pretrained: true = start from ImageNet weights (transfer learning) instead of random weights.
  pretrained: true
train:
  epochs: 30
  # batch_size: images per step (ResNet-50 uses 32 to fit in memory).
  batch_size: 64
  # lr: smaller than the CNN's 0.001, because we adjust already-good pretrained weights instead of learning from scratch.
  lr: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 1
  label_smoothing: 0.1
  class_weights: true
  amp: true
  early_stop_patience: 8

# CNN final config (#6): cnn_long + cnn_lightreg (the two best on FER-2013 val macro-F1).
# Class weights and augmentation are kept: removing them hurt (disgust F1 on RAF-DB -> 0 / heavy overfitting).
seed: 42
data:
  fer2013_root: data/fer2013
  rafdb_root: data/rafdb
  val_frac: 0.1
  img_size: 48
  channels: 1
  num_workers: 4
  augment: true
  random_erasing: 0.0
model:
  name: cnn
  num_classes: 7
  pretrained: false
  dropout: 0.2
  block_dropout: 0.1
train:
  epochs: 100
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 2
  label_smoothing: 0.1
  class_weights: true
  amp: true
  early_stop_patience: 15
